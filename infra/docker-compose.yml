# Explicit project name: the directory name "infra" is shared with unrelated stacks,
# and `docker compose down --remove-orphans` treats their containers as orphans.
name: llm-council

services:
  backend:
    container_name: council-backend
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    ports:
      # Loopback by default: the API can run local CLI agents via the shims and spends API
      # credit. Set BACKEND_BIND_HOST/FRONTEND_BIND_HOST=0.0.0.0 to reach it from the LAN.
      - "${BACKEND_BIND_HOST:-127.0.0.1}:8001:8001"
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # CLAUDE_SHIM_SECRET / ANTIGRAVITY_SHIM_SECRET come only from env_file (../.env),
      # the same file the host shims read, so there is one copy of each secret.
      QWEN_BASE_URL: "${QWEN_BASE_URL:-http://host.docker.internal:8002/v1}"
      QWEN_MODEL_ID: "${QWEN_MODEL_ID:-/models/qwen3.6-27b}"
      QWEN_API_KEY: "${QWEN_API_KEY:-not-needed}"
      CLAUDE_SHIM_BASE_URL: "${CLAUDE_SHIM_BASE_URL:-http://host.docker.internal:8600/v1}"
      ANTIGRAVITY_SHIM_BASE_URL: "${ANTIGRAVITY_SHIM_BASE_URL:-http://host.docker.internal:8601/v1}"
    env_file:
      - ../.env
    volumes:
      - council-data:/app/data
      - ../backend:/app/backend
      - ../.env:/app/.env:ro
      - ${SKILLS_DIR:-../skills}:/app/skills:ro
      - ${WORKSPACE_DIR:-..}:/app/workspace:ro
    extra_hosts:
      # Lets the container reach the claude-code-shim running on the host
      # (infra/local-models/claude_code_shim.py) regardless of the host's LAN IP.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  frontend:
    container_name: council-frontend
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:5173:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy

volumes:
  council-data:
    # Pinned to the name created under the old "infra" project so history survives.
    name: infra_council-data
