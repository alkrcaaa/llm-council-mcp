<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring Gradient (Antigravity Indigo to Qwen Cyan/Emerald) -->
    <linearGradient id="councilRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Core Synthesis Glow -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Circle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Council Deliberation Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#councilRing)" stroke-width="2.5" stroke-dasharray="30 4 12 4" stroke-linecap="round"/>

  <!-- Inner Subtle Orbital -->
  <circle cx="32" cy="32" r="14" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Model Nodes around the Council (Antigravity, Claude, Qwen, Gemini) -->
  <!-- Top: Antigravity (Indigo/Violet) -->
  <circle cx="32" cy="11" r="3.5" fill="#818cf8" filter="url(#glow)"/>
  <!-- Right: Gemini (Sky Blue) -->
  <circle cx="53" cy="32" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <!-- Bottom: Qwen (Emerald Green) -->
  <circle cx="32" cy="53" r="3.5" fill="#34d399" filter="url(#glow)"/>
  <!-- Left: Claude (Warm Amber/Coral) -->
  <circle cx="11" cy="32" r="3.5" fill="#fb923c" filter="url(#glow)"/>

  <!-- Central Chairman / Synthesis Core -->
  <polygon points="32,22 41,32 32,42 23,32" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
